- name: list of distionaries  #In real DevOps projects, you often combine lists and dictionaries.
  hosts: local
  connection: local
  vars:
    instances:
      - name: mongodb
        type: t3.micro
      - name: redis
        type: t3.small
      - name: frontend
        type: t3.micro
      - name: harish
        type: t3.medium  

  tasks:
    - name: Print EC2 configuration
      debug:
        msg: "{{ item.name }} uses {{ item.type }}"
      loop: "{{ instances }}"



#       5. How they are used in real DevOps work
#     Requirement	                      Ansible feature
# Install multiple packages	              List + loop
# Create 10 EC2 instances	                List + loop
# Store EC2 configuration	                Dictionary
# Configure different EC2 types	          List of dictionaries
# Run tasks only when needed	            Boolean + conditions
# Store output from a task	              register variable
# Hide passwords and secrets	            Ansible Vault + secret variables