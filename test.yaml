- name: list of distionaries
  hosts: local
  connection: local
  vars:
    instances:
      - name: mongodb
        type: t3.micro
      - name: redis
        type: t3.small
      - name: frontend
        type: t3.micro
      - name: harish
        type: t3.medium  

  tasks:
    - name: Print EC2 configuration
      debug:
        msg: "{{ item.name }} uses {{ item.type }}"
      loop: "{{ instances }}"