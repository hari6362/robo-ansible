- name: install packages
  hosts: local
  connection: local
  become: yes

  vars: 
    packages:
      - { name: nginx, state: present }

  tasks:
  - name: install package
    package: 
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop: "{{ packages }}"  


     
